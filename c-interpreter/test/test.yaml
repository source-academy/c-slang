---
assign:
  file: "assign.c"
  cases:
    - in: "42"
      out: "0"
      desc: different types of assignments
blocks:
  file: "blocks.c"
  cases:
    - in: "42"
      out: "0"
      desc: nested blocks in function
forward-decl:
  file: "forward-decl.c"
  cases:
    - in: "42"
      out: "1"
      desc: forward declarations for structs
heap:
  file: "heap.c"
  cases:
    - in: "42"
      out: "0"
      desc: heap allocations
linked-list:
  file: "linked-list.c"
  cases:
    - in: "42"
      out: "0"
      desc: linked list with self-referential struct
loops:
  file: "loops.c"
  cases:
    - in: "42"
      out: "0"
      desc: for and while loops with break and continue
strict-aliasing:
  file: "strict-aliasing.c"
  cases:
    - in: "42"
      out: "1"
      fail: true
      desc: test for strict aliasing undefined behaviour
struct-init:
  file: "struct-init.c"
  cases:
    - in: "42"
      out: "0"
      desc: list initialization for structs
struct:
  file: "struct.c"
  cases:
    - in: "42"
      out: "0"
      desc: structures
short-circuit-and:
  file: "short-circuit-and.c"
  cases:
    - in: "42"
      out: "0"
      desc: "A1 (roadmap): && must not evaluate its right operand when the left is false"
short-circuit-or:
  file: "short-circuit-or.c"
  cases:
    - in: "42"
      out: "0"
      desc: "A1 (roadmap): || must not evaluate its right operand when the left is true"
array-decay:
  file: "array-decay.c"
  cases:
    - in: "42"
      out: "13"
      desc: "A1 (roadmap): arr[i][j] must decay/subscript with the correct row stride"
array-nested-write:
  file: "array-nested-write.c"
  cases:
    - in: "42"
      out: "99"
      desc: "A1 (roadmap): writing/reading arr[0][0] on a 2D array must not throw a false strict-aliasing violation (EffectiveTypeTable fallback-depth bug, isolated from row-stride decay)"
address-of-array-subscript:
  file: "address-of-array-subscript.c"
  cases:
    - in: "42"
      out: "77"
      desc: "&arr[i] on a 2D array must have type pointer-to-array, not a spurious extra pointer indirection"
address-of-array-identifier:
  file: "address-of-array-identifier.c"
  cases:
    - in: "42"
      out: "55"
      desc: "&arr on a whole 2D array must have type pointer-to-array-of-array, not a spurious extra pointer indirection"
address-of-struct-array-member:
  file: "address-of-struct-array-member.c"
  cases:
    - in: "42"
      out: "88"
      desc: "&s.row on an array-typed struct member must have type pointer-to-array, not a spurious extra pointer indirection"
array-interior-write:
  file: "array-interior-write.c"
  cases:
    - in: "42"
      out: "41"
      desc: "arr[1][1] (a non-edge row and column, not just index-0/index-max corners) must read back the value written to it"
bitwise-and-or-xor:
  file: "bitwise-and-or-xor.c"
  cases:
    - in: "42"
      out: "946"
      desc: "A2 (roadmap): bitwise &, |, ^ on int operands"
bitwise-shift-basic:
  file: "bitwise-shift-basic.c"
  cases:
    - in: "42"
      out: "12"
      desc: "A2 (roadmap): << and >> on positive int operands"
bitwise-shift-signedness:
  file: "bitwise-shift-signedness.c"
  cases:
    - in: "42"
      out: "2147483644"
      desc: "A2 (roadmap): >> on an unsigned int must be a logical (zero-fill) shift, not arithmetic (sign-extending)"
bitwise-shift-unsigned-overflow:
  file: "bitwise-shift-unsigned-overflow.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A2 (roadmap): << on an unsigned int that shifts bits out past the type's width is well-defined modular reduction, not UB - distinct from bitwise-shift-narrow-type.c, which covers the signed (UB) case"
bitwise-shift-narrow-type:
  file: "bitwise-shift-narrow-type.c"
  cases:
    - in: "42"
      out: "1"
      fail: true
      desc: "A2 (roadmap): << keeps the type-checker's (unpromoted) result type - c << 10 on a char computes 1024 then narrows back to char width, which correctly throws as UB (signed overflow), same as any other signed narrowing conversion in this interpreter"
bitwise-not:
  file: "bitwise-not.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A2 (roadmap): unary ~ on a positive int (~5 == -6)"
bitwise-not-unsigned:
  file: "bitwise-not-unsigned.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A2 (roadmap): unary ~ on unsigned int 0 sets every bit (~0u == UINT_MAX exactly); checked via an unsigned == unsigned comparison, not by returning UINT_MAX itself, since main's hardcoded int return type would need a separate (and separately out-of-scope) unsigned-to-signed narrowing conversion"
unary-minus-promotion:
  file: "unary-minus-promotion.c"
  cases:
    - in: "42"
      out: "-200"
      desc: "A2 (roadmap): unary - must apply integer promotions before negating, same as the type-checker declares (typeUnaryExpressionNode's +/-/~ cases all use applyIntegerPromotions) - -uc on an unsigned char must promote to int first (giving -200), not negate+wrap at unsigned char width (which would silently give 56)"
prefix-increment:
  file: "prefix-increment.c"
  cases:
    - in: "42"
      out: "66"
      desc: "A2 (roadmap): ++x increments in place and evaluates to the new value"
postfix-increment:
  file: "postfix-increment.c"
  cases:
    - in: "42"
      out: "65"
      desc: "A2 (roadmap): x++ increments in place but evaluates to the old value"
prefix-decrement:
  file: "prefix-decrement.c"
  cases:
    - in: "42"
      out: "44"
      desc: "A2 (roadmap): --x decrements in place and evaluates to the new value"
postfix-decrement:
  file: "postfix-decrement.c"
  cases:
    - in: "42"
      out: "45"
      desc: "A2 (roadmap): x-- decrements in place but evaluates to the old value"
pointer-increment:
  file: "pointer-increment.c"
  cases:
    - in: "42"
      out: "130"
      desc: "A2 (roadmap): p++ on a pointer must advance by sizeof(*p), not by one byte"
compound-assign-arithmetic:
  file: "compound-assign-arithmetic.c"
  cases:
    - in: "42"
      out: "3"
      desc: "A2 (roadmap): +=, -=, *=, /=, %= chained on an int"
compound-assign-bitwise:
  file: "compound-assign-bitwise.c"
  cases:
    - in: "42"
      out: "10"
      desc: "A2 (roadmap): &=, |=, ^= chained on an int"
compound-assign-shift:
  file: "compound-assign-shift.c"
  cases:
    - in: "42"
      out: "12"
      desc: "A2 (roadmap): <<=, >>= chained on an int"
compound-assign-pointer:
  file: "compound-assign-pointer.c"
  cases:
    - in: "42"
      out: "1300"
      desc: "A2 (roadmap): += and -= on a pointer must scale by sizeof(*p), same as +/- and ++/--"
compound-assign-narrowing:
  file: "compound-assign-narrowing.c"
  cases:
    - in: "42"
      out: "4"
      desc: "A2 (roadmap): c += 10 on an unsigned char must narrow/wrap the result back to unsigned char width (250+10=260, well-defined wraparound to 4), not leave it at whatever wider type the addition itself computed in"
pointer-minus-pointer:
  file: "pointer-minus-pointer.c"
  cases:
    - in: "42"
      out: "2"
      desc: "A2 (roadmap): ptr - ptr yields a count of elements, not a byte difference"
pointer-minus-pointer-negative:
  file: "pointer-minus-pointer-negative.c"
  cases:
    - in: "42"
      out: "-2"
      desc: "A2 (roadmap): ptr - ptr can be negative when the left pointer is earlier in the array than the right"
pointer-minus-pointer-row-stride:
  file: "pointer-minus-pointer-row-stride.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A2 (roadmap): ptr - ptr must divide by the pointed-to type's own size (here, a 20-byte array-of-5-int row), not assume a 4-byte int element"
pointer-init-from-array:
  file: "pointer-init-from-array.c"
  cases:
    - in: "42"
      out: "10"
      desc: "bugfix: int *p = arr; (pointer initialized directly from a file-scope array identifier) must decay the array to a pointer, same as plain assignment already does"
pointer-init-from-array-arithmetic:
  file: "pointer-init-from-array-arithmetic.c"
  cases:
    - in: "42"
      out: "142"
      desc: "bugfix: a pointer initialized from an array identifier must behave identically to one built via plain assignment, including pointer arithmetic afterwards"
pointer-init-from-local-array:
  file: "pointer-init-from-local-array.c"
  cases:
    - in: "42"
      out: "6"
      desc: "bugfix: same decay-on-initialization fix, but for a local (stack-frame) array instead of a file-scope one, which computes its address differently"
pointer-init-from-array-incompatible:
  file: "pointer-init-from-array-incompatible.c"
  cases:
    - in: "42"
      out: "1"
      desc: "bugfix regression guard: decaying the array must not loosen the compatibility check - char *p = arr; (int[3]) is still invalid, since char and int are not compatible referenced types"
      fail: true
string-literal-basic:
  file: "string-literal-basic.c"
  cases:
    - in: "42"
      out: "209"
      desc: "A3 (roadmap): a string literal decays to char* and reads back its actual character content ('h'=104, 'i'=105)"
string-literal-escape:
  file: "string-literal-escape.c"
  cases:
    - in: "42"
      out: "10"
      desc: "A3: escape sequences in a string literal ('\\n'=10) carry through to the actual runtime byte content, not just the literal's length"
string-literal-null-terminator:
  file: "string-literal-null-terminator.c"
  cases:
    - in: "42"
      out: "2"
      desc: "A3: a 2-character literal is allocated as exactly 3 bytes (the terminating null included), not 2 or 4 - walking past the characters lands on a real null byte at index 2"
string-literal-same-occurrence-shares-storage:
  file: "string-literal-same-occurrence-shares-storage.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A3 (design decision): the same string literal AST node, revisited across loop iterations, reuses the same storage every time"
string-literal-distinct-occurrences-dont-share-storage:
  file: "string-literal-distinct-occurrences-dont-share-storage.c"
  cases:
    - in: "42"
      out: "0"
      desc: "A3 (design decision): two textually-identical string literals at different source locations get independent storage (the C standard leaves sharing unspecified; this interpreter chooses not to)"
string-literal-write-is-ub:
  file: "string-literal-write-is-ub.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A3: modifying a string literal is UB (6.4.5p7) - this interpreter models it concretely as a write to read-only memory, not a silent write"
      fail: true
string-array-init-exact-fit:
  file: "string-array-init-exact-fit.c"
  cases:
    - in: "42"
      out: "209"
      desc: "A3 follow-up (6.7.9p14): char arr[3] = \"hi\"; - the literal's characters plus its terminator fit exactly"
string-array-init-padded:
  file: "string-array-init-padded.c"
  cases:
    - in: "42"
      out: "0"
      desc: "A3 follow-up: char arr[5] = \"hi\"; - characters, then the terminator, then the remaining elements are zero-filled like any other aggregate with fewer initializers than elements"
string-array-init-no-terminator:
  file: "string-array-init-no-terminator.c"
  cases:
    - in: "42"
      out: "209"
      desc: "A3 follow-up (6.7.9p14 special case): char arr[2] = \"hi\"; - array size equals the character count exactly, so the terminator is legally omitted (a classic non-null-terminated-array footgun, tested deliberately)"
string-array-init-too-long:
  file: "string-array-init-too-long.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A3 follow-up: char arr[1] = \"hi\"; must be rejected at type-check time - the array is too small even to hold the characters, let alone the terminator"
      fail: true
string-array-init-mutable:
  file: "string-array-init-mutable.c"
  cases:
    - in: "42"
      out: "120"
      desc: "A3 follow-up: the initialized array is a real, independent, mutable copy of the literal's bytes - not the literal's own read-only storage"
prototype-forward-declare:
  file: "prototype-forward-declare.c"
  cases:
    - in: "42"
      out: "25"
      desc: "A4.1: a plain forward declaration (int square(int);) ahead of main, defined after main, now type-checks and calls correctly"
prototype-mutual-recursion:
  file: "prototype-mutual-recursion.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A4.1: mutual recursion (isEven/isOdd calling each other) via one forward declaration - the actual point of this feature"
prototype-never-defined:
  file: "prototype-never-defined.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A4.1: a function declared only as a prototype, never defined anywhere in the file, is now rejected at the end of type-checking (mirrors a linker's undefined-reference error)"
      fail: true
prototype-conflicting-types:
  file: "prototype-conflicting-types.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A4.1: a prototype and its later definition disagree on parameter count - rejected as conflicting types"
      fail: true
prototype-redefinition:
  file: "prototype-redefinition.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A4.1 (regression guard): two full definitions of the same function, no prototype involved, is still rejected as a redefinition"
      fail: true
prototype-block-scope:
  file: "prototype-block-scope.c"
  cases:
    - in: "42"
      out: "12"
      desc: "A4.1: a function prototype declared inside another function's body (block scope) works the same way, falling out of the same scoping mechanism for free"
for-loop-declaration-basic:
  file: "for-loop-declaration-basic.c"
  cases:
    - in: "42"
      out: "10"
      desc: "A4.2: for (int i = 0; i < 5; i = i + 1) sums 0..4 - the basic C99 for-scoped declaration happy path"
for-loop-declaration-multiple-declarators:
  file: "for-loop-declaration-multiple-declarators.c"
  cases:
    - in: "42"
      out: "5"
      desc: "A4.2: for (int i = 0, j = 10; i < j; i = i+1, j = j-1) - multiple declarators in one for-init fall out for free from Declaration's existing multi-declarator support"
for-loop-declaration-scope-leak:
  file: "for-loop-declaration-scope-leak.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A4.2: a for-loop's declared variable is not visible after the loop ends in the same block (6.8.5p5) - referencing it there is a type-check error"
      fail: true
for-loop-declaration-sibling-loops:
  file: "for-loop-declaration-sibling-loops.c"
  cases:
    - in: "42"
      out: "9"
      desc: "A4.2: two consecutive for-loops in the same block, both declaring their own int i, do not throw a redeclaration error - each for-loop gets its own scope"
for-loop-declaration-typedef-rejected:
  file: "for-loop-declaration-typedef-rejected.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A4.2: a typedef in a for-loop's declaration part is rejected at type-check time"
      fail: true
for-loop-void-init-expression:
  file: "for-loop-void-init-expression.c"
  cases:
    - in: "42"
      out: "3"
      desc: "A4.2 (regression guard): a void-returning function call as a for-loop's init expression no longer crashes - the post-init pop is now conditioned on the init expression not being void, same as ExpressionStatement already does"
nested-loop-continue:
  file: "nested-loop-continue.c"
  cases:
    - in: "42"
      out: "3"
      desc: "A4.3 (adjacent bug found and fixed alongside): TypeEnv's loop-body flag was a boolean, not a counter, so an inner loop's own exitLoopBody() incorrectly cleared it while still lexically inside the outer loop - a trailing continue after a nested inner loop was wrongly rejected before this fix"
switch-basic-match:
  file: "switch-basic-match.c"
  cases:
    - in: "42"
      out: "20"
      desc: "A4.3: a matching case runs its own statements up to its own break, and nothing else"
switch-fallthrough:
  file: "switch-fallthrough.c"
  cases:
    - in: "42"
      out: "11"
      desc: "A4.3: a case with no break falls through into the next case's statements"
switch-stacked-labels:
  file: "switch-stacked-labels.c"
  cases:
    - in: "42"
      out: "5"
      desc: "A4.3: stacked labels (case 1: case 2: ...) share one body - the inner label is nested inside the outer one's wrapped statement, not a sibling"
switch-default-fallback:
  file: "switch-default-fallback.c"
  cases:
    - in: "42"
      out: "42"
      desc: "A4.3: default runs when no case value matches"
switch-default-before-cases:
  file: "switch-default-before-cases.c"
  cases:
    - in: "42"
      out: "42"
      desc: "A4.3: default's position in the switch body is independent of ordering - it need not be last, or even after every case"
switch-negative-case:
  file: "switch-negative-case.c"
  cases:
    - in: "42"
      out: "7"
      desc: "A4.3: a negated integer literal case constant (case -1:) parses and dispatches correctly"
switch-no-match-no-default:
  file: "switch-no-match-no-default.c"
  cases:
    - in: "42"
      out: "5"
      desc: "A4.3: no case matches and there's no default - the whole switch body is skipped, control falls through to what follows it"
switch-break-nested-in-loop:
  file: "switch-break-nested-in-loop.c"
  cases:
    - in: "42"
      out: "2"
      desc: "A4.3: break inside a switch nested in a loop only exits the switch, not the enclosing loop"
switch-continue-nested-in-switch:
  file: "switch-continue-nested-in-switch.c"
  cases:
    - in: "42"
      out: "2"
      desc: "A4.3 (regression guard): continue inside a loop nested in a switch's case still correctly continues the loop, unaffected by the enclosing switch - and the loop/switch nesting counter fix doesn't break this"
switch-duplicate-case:
  file: "switch-duplicate-case.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A4.3: two case labels with the same value in one switch are rejected at type-check time (6.8.4.2p3)"
      fail: true
switch-multiple-default:
  file: "switch-multiple-default.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A4.3: more than one default label in one switch is rejected at type-check time (6.8.4.2p2)"
      fail: true
switch-case-outside-switch:
  file: "switch-case-outside-switch.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A4.3: a case label outside any switch statement is rejected at type-check time"
      fail: true
switch-non-compound-body:
  file: "switch-non-compound-body.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A4.3 (scope decision): a switch whose body isn't a brace-enclosed compound statement is rejected"
      fail: true
switch-nested-block-case:
  file: "switch-nested-block-case.c"
  cases:
    - in: "42"
      out: "1"
      desc: "A4.3 (scope decision): a case label nested inside an if within the switch, rather than a direct top-level item of the switch's own body, is rejected - no Duff's-device-style tricks"
      fail: true